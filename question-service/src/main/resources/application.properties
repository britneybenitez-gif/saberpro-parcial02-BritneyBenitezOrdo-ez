spring.application.name=question-service
server.port=8083
saberpro.validation-url=${VALIDATION_URL:http://localhost:8082}
saberpro.lifecycle-url=${LIFECYCLE_URL:http://localhost:8084}

spring.datasource.url=${QUESTION_DB_URL:jdbc:h2:file:./data/questions}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saberpro}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:saberpro_local}
spring.rabbitmq.connection-timeout=2s
