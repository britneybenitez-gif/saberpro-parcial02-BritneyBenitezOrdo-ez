spring.application.name=lifecycle-service
server.port=8084
spring.datasource.url=${LIFECYCLE_DB_URL:jdbc:h2:file:./data/lifecycle}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saberpro}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:saberpro_local}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
